services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - EXPORT_TOKEN=${EXPORT_TOKEN:?set it in .env}
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
